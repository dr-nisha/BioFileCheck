[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biofilecheck"
version = "0.1.0"
description = "Local FASTA and FASTQ structural validation with machine-readable reports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
biofilecheck = "biofilecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
